<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd9e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="A small good morning rose garden. Pick roses and make a bouquet.">
<title>Good Morning Baby - Your Rose Bouquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    height: 100vh;
    height: 100dvh;
    display: flex; flex-direction: column;
    overflow-x: hidden; overflow-y: hidden;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.15rem;
    color: #5b1a33;
    text-align: center;
    background:
      radial-gradient(circle at 50% 0%, #fff4ee 0%, rgba(255,244,238,0) 55%),
      linear-gradient(180deg, #ffd9e2 0%, #f7b6c8 60%, #e89bb3 100%);
    background-attachment: fixed;
    padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 10px)
             calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 10px);
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  #stage { position: relative; z-index: 1; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  h1, #hint, #bouquetBox, #message { flex: none; }
  /* once the bouquet is finished the page may scroll on small phones */
  body.done { height: auto; min-height: 100vh; min-height: 100dvh; overflow-y: auto; }
  body.done #stage { justify-content: center; }

  h1 {
    font-family: "Great Vibes", "Snell Roundhand", cursive;
    font-weight: 400;
    font-size: 3rem;
    line-height: 1.1;
    color: #b0173f;
    text-shadow: 0 2px 10px rgba(255,255,255,.7);
  }
  #hint { margin: 2px 0 8px; font-style: italic; font-size: 1.1rem; }

  /* the garden */
  #garden {
    --w: clamp(50px, 15vw, 66px);
    display: flex; flex-wrap: wrap; justify-content: center;
    align-content: flex-start;
    width: 100%; max-width: 440px; max-height: 800px;
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    margin: 0 auto; padding: 0 6px calc(var(--w) * .85);
    transition: max-height .9s ease, opacity .7s ease, padding .9s ease;
  }
  #garden.done { flex: 0 0 0; max-height: 0; opacity: 0; padding-bottom: 0; overflow: hidden; pointer-events: none; }
  .rose {
    width: var(--w); margin-bottom: calc(var(--w) * -.85);
    background: none; border: 0; cursor: pointer;
    transition: transform .35s ease, opacity .35s ease;
  }
  .rose svg { width: 100%; height: auto; display: block; transform-origin: 50% 100%; animation: sway 3.2s ease-in-out infinite alternate; }
  .rose.gone { transform: scale(0); opacity: 0; pointer-events: none; }
  @media (hover: hover) { .rose:hover { transform: scale(1.12); } }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }

  /* the bouquet */
  #bouquetBox { position: relative; width: 100%; height: 255px; transition: height 1s ease, margin 1s ease; }
  #bouquetBox.done { height: 390px; margin: 16px 0; }
  #bouquet {
    position: absolute; left: 50%; bottom: 0; width: 340px; height: 340px; margin-left: -170px;
    transform-origin: 50% 100%; transform: scale(.72);
    transition: transform 1s ease;
  }
  #bouquet.done { transform: scale(1.1); }
  .picked {
    position: absolute; left: 50%; bottom: 100px; width: 56px; margin-left: -28px;
    display: flex; flex-direction: column; align-items: center;
    transform-origin: 50% 100%; transform: rotate(0deg) scale(0);
    transition: transform .8s cubic-bezier(.2, 1.4, .4, 1);
  }
  .picked svg { width: 56px; height: 56px; display: block; }
  .stem {
    display: block; width: 4px; height: var(--len, 40px); border-radius: 2px;
    background: linear-gradient(90deg, #2f6b34, #4d9a50);
    transition: height .8s ease;
  }
  .wrap {
    position: absolute; left: 50%; bottom: 0; width: 124px; height: 92px; margin-left: -62px; z-index: 5;
    background: linear-gradient(135deg, #ffffff 0%, #f9cdd9 100%);
    -webkit-clip-path: polygon(0 0, 100% 0, 62% 100%, 38% 100%);
    clip-path: polygon(0 0, 100% 0, 62% 100%, 38% 100%);
  }
  .ribbon { position: absolute; left: 50%; bottom: 32px; margin-left: -18px; z-index: 6; font-size: 2rem; line-height: 1; }

  /* final message */
  #message { max-height: 0; opacity: 0; overflow: hidden; transition: opacity 1.6s ease .4s; }
  #message.show { max-height: 400px; opacity: 1; }
  #message h2 {
    font-family: "Great Vibes", "Snell Roundhand", cursive; font-weight: 400;
    font-size: 3.2rem; color: #b0173f; margin-bottom: 4px;
  }
  #message p { font-size: 1.4rem; font-style: italic; }
  #again {
    margin-top: 18px; min-height: 44px; padding: 8px 26px; border: 0; border-radius: 22px;
    background: #b0173f; color: #fff; font: inherit; font-size: 1.1rem; cursor: pointer;
  }

  /* falling petals */
  #petals { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .petal {
    position: absolute; top: 0;
    width: var(--s); height: calc(var(--s) * 1.3);
    background: radial-gradient(circle at 30% 30%, #ffe3ea, var(--pc));
    border-radius: 150% 0 150% 0; opacity: .85; will-change: transform;
    animation: fall var(--t) linear var(--delay, 0s) forwards;
  }
  @keyframes fall {
    0%   { transform: translate3d(0, -30px, 0) rotate(0deg); }
    50%  { transform: translate3d(var(--dx), 50vh, 0) rotate(var(--r1)); }
    100% { transform: translate3d(0, 105vh, 0) rotate(var(--r2)); }
  }
  @media (prefers-reduced-motion: reduce) { .petal, .rose svg { animation: none; } }
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>

<main id="stage">
  <h1>Good Morning</h1>
  <p id="hint">Pick 25 roses for your bouquet (<span id="count">0</span>/25)</p>

  <section id="garden" aria-label="Rose garden"></section>

  <div id="bouquetBox">
    <section id="bouquet" aria-label="Your bouquet">
      <div id="fan"></div>
      <div class="wrap"></div>
      <div class="ribbon">🎀</div>
    </section>
  </div>

  <section id="message">
    <h2>I love you ❤️</h2>
    <p>Good morning. Have a nice day.</p>
    <button id="again" type="button">Pick again</button>
  </section>
</main>

<script>
  var TOTAL = 25;      // roses needed for the bouquet
  var IN_GARDEN = 39;  // roses growing in the garden

  // her three favourites: red, pink and black (colours repeat on purpose)
  var reds   = ["#d81b3c", "#b3122f", "#e63950"];
  var pinks  = ["#ff8fb1", "#f2658a", "#ffb6c8"];
  var blacks = ["#2a2230", "#221b29"];
  var garden = document.getElementById("garden");
  var fan = document.getElementById("fan");
  var bouquet = document.getElementById("bouquet");
  var box = document.getElementById("bouquetBox");
  var message = document.getElementById("message");
  var hint = document.getElementById("hint");
  var picked = 0;

  // lighten (p > 0) or darken (p < 0) a hex colour
  function shade(hex, p) {
    var n = parseInt(hex.slice(1), 16);
    var r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    var t = p < 0 ? 0 : 255, k = Math.abs(p);
    r = Math.round(r + (t - r) * k);
    g = Math.round(g + (t - g) * k);
    b = Math.round(b + (t - b) * k);
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  // colour set for one rose; very dark roses get lifted shades so the petals still show
  function palette(base) {
    var n = parseInt(base.slice(1), 16);
    var lum = 0.3 * (n >> 16) + 0.59 * ((n >> 8) & 255) + 0.11 * (n & 255);
    if (lum < 70) {
      return { dark: shade(base, -0.55), mid: base, base: shade(base, 0.1), light: shade(base, 0.26), edge: "#000000" };
    }
    return { dark: shade(base, -0.38), mid: shade(base, -0.16), base: base, light: shade(base, 0.2), edge: shade(base, -0.55) };
  }

  // the rose head is built from layers of petals turned around the centre
  function roseHead(base) {
    var P = palette(base);
    var petal = "M50 52C25 45 22 16 40 11Q50 6 60 11C78 16 75 45 50 52Z";
    function layer(count, scale, offset, fill, stroke) {
      var out = "";
      for (var i = 0; i < count; i++) {
        var angle = offset + i * (360 / count);
        out += '<path d="' + petal + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1" ' +
               'transform="rotate(' + angle + ' 50 50) translate(50 50) scale(' + scale + ') translate(-50 -50)"/>';
      }
      return out;
    }
    return layer(7, 1.0, 0, P.dark, P.edge) +
           layer(6, 0.82, 25, P.mid, P.dark) +
           layer(5, 0.62, 10, P.base, P.dark) +
           layer(4, 0.42, 40, P.light, P.mid) +
           '<path d="M50 50m-3 0a3 3 0 1 1 6 0a6 6 0 1 1-12 0" fill="none" stroke="' + P.dark + '" stroke-width="1.5" stroke-linecap="round"/>';
  }

  // just the head, used in the bouquet (the stem there is plain CSS so it can grow)
  function headSVG(base) {
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' + roseHead(base) + '</svg>';
  }

  function roseSVG(base) {
    return '<svg viewBox="0 0 100 190" aria-hidden="true">' +
      '<path d="M50 88C49 120 51 150 50 190" stroke="#3b7d3f" stroke-width="5" fill="none" stroke-linecap="round"/>' +
      '<path d="M50 140C72 136 84 122 86 108C66 110 54 122 50 140Z" fill="#4d9a50"/>' +
      '<path d="M50 160C30 158 18 146 15 134C34 134 46 144 50 160Z" fill="#3f8a45"/>' +
      roseHead(base) + '</svg>';
  }

  function shuffle(list) {
    for (var i = list.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    }
    return list;
  }

  function plant() {
    var groups = [reds, pinks, blacks];
    var order = [];
    for (var i = 0; i < IN_GARDEN; i++) {
      var group = groups[i % 3];
      order.push(group[Math.floor(i / 3) % group.length]);
    }
    shuffle(order);

    garden.innerHTML = "";
    fan.innerHTML = "";
    picked = 0;
    garden.classList.remove("done");
    bouquet.classList.remove("done");
    box.classList.remove("done");
    document.body.classList.remove("done");
    garden.scrollTop = 0;
    message.classList.remove("show");
    hint.style.display = "";
    hint.innerHTML = 'Pick ' + TOTAL + ' roses for your bouquet (<span id="count">0</span>/' + TOTAL + ')';

    order.forEach(function (color, i) {
      var btn = document.createElement("button");
      btn.className = "rose";
      btn.type = "button";
      btn.setAttribute("aria-label", "Pick a rose");
      btn.dataset.color = color;
      btn.innerHTML = roseSVG(color);
      btn.querySelector("svg").style.animationDelay = (i % 7) * 0.3 + "s";
      btn.addEventListener("click", pick);
      garden.appendChild(btn);
    });
  }

  function pick(e) {
    if (picked >= TOTAL) return;
    var btn = e.currentTarget;
    btn.disabled = true;
    btn.classList.add("gone");

    var item = document.createElement("div");
    item.className = "picked";
    item.dataset.tier = (picked % 4);
    item.innerHTML = headSVG(btn.dataset.color) + '<i class="stem"></i>';
    fan.appendChild(item);
    picked++;
    document.getElementById("count").textContent = picked;

    // wait one frame so the pop-in animation can run
    requestAnimationFrame(function () { requestAnimationFrame(arrange); });

    if (picked === TOTAL) finish();
  }

  // Lay the roses out like a round bouquet. Four rows: short stems spread wide
  // at the front, long stems stay near the middle at the back. As more roses
  // are added the stems grow a little so the roses spread out and stay visible.
  // The holder stays fixed below the flowers.
  var spread = [74, 60, 44, 26];     // half-angle of each row, in degrees
  var stemLen = [34, 64, 94, 124];   // stem length of each row, in px

  function arrange() {
    var items = fan.children;
    var n = items.length;
    var progress = n / TOTAL;
    var grow = 0.8 + 0.4 * progress;


    for (var t = 0; t < 4; t++) {
      var row = [];
      for (var i = 0; i < n; i++) if (+items[i].dataset.tier === t) row.push(items[i]);
      row.forEach(function (el, k) {
        var angle;
        if (row.length === 1) angle = (t % 2 ? -1 : 1) * spread[t] * 0.3;
        else angle = -spread[t] + k * (2 * spread[t] / (row.length - 1));
        el.style.transform = "rotate(" + angle + "deg)";
        el.style.setProperty("--len", Math.round(stemLen[t] * grow) + "px");
        el.style.zIndex = 4 - t;
      });
    }
  }

  function finish() {
    setTimeout(function () {
      garden.classList.add("done");
      bouquet.classList.add("done");
      box.classList.add("done");
      document.body.classList.add("done");
      hint.style.display = "none";
      message.classList.add("show");
      for (var i = 0; i < 30; i++) dropPetal(i * 0.12);
    }, 900);
  }

  // petals drifting down the screen
  var petalColors = ["#f48fb1", "#ff8fb1", "#ec407a", "#f8bbd0", "#e91e63"];
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function dropPetal(delay) {
    var p = document.createElement("i");
    p.className = "petal";
    p.style.left = Math.random() * 100 + "vw";
    p.style.setProperty("--s", 10 + Math.random() * 10 + "px");
    p.style.setProperty("--t", 8 + Math.random() * 6 + "s");
    p.style.setProperty("--dx", Math.random() * 120 - 60 + "px");
    p.style.setProperty("--r1", Math.random() * 360 + "deg");
    p.style.setProperty("--r2", 360 + Math.random() * 360 + "deg");
    p.style.setProperty("--pc", petalColors[Math.floor(Math.random() * petalColors.length)]);
    p.style.setProperty("--delay", (delay || 0) + "s");
    p.addEventListener("animationend", function () { p.remove(); });
    document.getElementById("petals").appendChild(p);
  }

  if (!reduceMotion) {
    for (var k = 0; k < 8; k++) dropPetal(k * 0.8);
    setInterval(function () {
      if (document.getElementById("petals").children.length < 22) dropPetal(0);
    }, 700);
  }

  document.getElementById("again").addEventListener("click", plant);
  plant();
</script>
</body>
</html>
