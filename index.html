<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Good Morning, My Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg1:#0b0614; --bg2:#1a0b2e; --bg3:#2b1038;
  --rose:#ff8fb1; --rose-soft:#ffc2d6; --gold:#f5d28a; --text:#fbeaf1; --muted:#c9a9bb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 0%,var(--bg3) 0%,var(--bg2) 45%,var(--bg1) 100%);
  color:var(--text);
  font-family:'Cormorant Garamond',Georgia,serif;
  overflow:hidden;
}
#stars,#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.glow{position:fixed;left:50%;top:38%;width:70vmin;height:70vmin;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,143,177,.22),transparent 65%);filter:blur(20px);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px}
.sun{font-size:2.2rem;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
h1{font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400;font-size:clamp(3.2rem,12vw,6.5rem);margin:0;line-height:1.05;
  background:linear-gradient(90deg,var(--rose-soft),var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(255,143,177,.25);opacity:0;animation:rise 1.6s .2s forwards}
.love{font-size:clamp(1.3rem,4.5vw,2rem);font-style:italic;color:var(--rose-soft);margin:4px 0 26px;opacity:0;animation:rise 1.6s 1s forwards}
.love span{color:var(--rose);display:inline-block;animation:beat 1.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{opacity:0;animation:rise 1.6s 1.8s forwards;padding:22px 30px;border-radius:22px;max-width:92vw;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,194,214,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 10px 50px rgba(0,0,0,.4)}
.label{font-size:1.05rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.big{font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(2.6rem,9vw,4.2rem);color:var(--gold);margin:4px 0 2px;line-height:1.1}
.units{display:flex;gap:clamp(12px,4vw,26px);justify-content:center;margin-top:10px}
.u b{display:block;font-size:clamp(1.5rem,5.5vw,2.2rem);font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.u i{font-style:normal;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.foot{margin-top:22px;font-size:1.05rem;color:var(--muted);font-style:italic;opacity:0;animation:rise 1.6s 2.6s forwards}
.card{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .25s,box-shadow .25s}
.card:active{transform:scale(.97)}
.hint{margin-top:14px;padding:8px 18px;border-radius:999px;font-size:.85rem;font-weight:600;font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:#2b1038;
  background:linear-gradient(90deg,var(--rose-soft),var(--gold));box-shadow:0 0 14px rgba(255,143,177,.35);animation:softpulse 3s ease-in-out infinite}
@keyframes softpulse{50%{opacity:.8}}
.msg{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;
  background:radial-gradient(ellipse at 50% 40%,rgba(80,20,60,.92),rgba(11,6,20,.96));opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s;cursor:pointer}
.msg.show{opacity:1;visibility:visible}
.msg h2{font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400;font-size:clamp(3.4rem,13vw,7rem);margin:0;line-height:1.1;
  background:linear-gradient(90deg,var(--rose-soft),var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent;transform:scale(.8);transition:transform 1.2s cubic-bezier(.2,1.2,.3,1)}
.msg.show h2{transform:scale(1)}
.msg p{font-size:clamp(1.4rem,5vw,2.1rem);font-style:italic;color:var(--rose-soft);margin:14px 0 0}
.msg small{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));color:var(--muted);letter-spacing:.2em;text-transform:uppercase;font-size:.75rem}
.heart{position:fixed;bottom:-30px;z-index:21;pointer-events:none;color:var(--rose);animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="glow"></div>
<canvas id="petals"></canvas>
<main>
  <div class="sun">🌸</div>
  <h1>Good Morning</h1>
  <div style="height:22px"></div>
  <section class="card" id="card" role="button" tabindex="0" aria-label="Tap for a message">
    <div class="label" id="label">Until your birthday</div>
    <div class="big" id="big">7 days</div>
    <div class="units">
      <div class="u"><b id="d">0</b><i>days</i></div>
      <div class="u"><b id="h">00</b><i>hours</i></div>
      <div class="u"><b id="m">00</b><i>min</i></div>
      <div class="u"><b id="s">00</b><i>sec</i></div>
    </div>
  </section>
  <p class="foot" id="foot">Rise and shine, my beautiful girl. The whole day is waiting for your smile.</p>
  <p class="hint">tap the timer, there’s something for you 💌</p>
  <div class="msg" id="msg" aria-live="polite">
    <h2>I love you, baby</h2>
    <p>I hope you have a great day.</p>
    <small>tap to close</small>
  </div>
</main>
<script>
// ---- Settings: easy to change ----
var BIRTHDAY = new Date(2026, 9, 31, 0, 0, 0); // 31 Oct 2026, local time (month is 0-based)

// ---- Countdown ----
var $ = function(id){ return document.getElementById(id); };
var pad = function(n){ return String(n).padStart(2, '0'); };
function tick(){
  var diff = BIRTHDAY - new Date();
  if (diff <= 0){
    $('label').textContent = 'Today is the day';
    $('big').textContent = 'Happy Birthday, my love';
    $('foot').textContent = 'The world got a little brighter the day you arrived.';
    document.querySelector('.units').style.display = 'none';
    return;
  }
  var days = Math.floor(diff / 864e5);
  var h = Math.floor(diff % 864e5 / 36e5);
  var m = Math.floor(diff % 36e5 / 6e4);
  var s = Math.floor(diff % 6e4 / 1e3);
  $('big').textContent = (days === 0 ? 'Tomorrow' : days + (days === 1 ? ' day' : ' days'));
  $('d').textContent = days; $('h').textContent = pad(h); $('m').textContent = pad(m); $('s').textContent = pad(s);
}
tick(); setInterval(tick, 1000);

// ---- Tap the timer for the love message ----
(function(){
  var card = $('card'), msg = $('msg');
  function hearts(){
    for (var i = 0; i < 22; i++){
      var h = document.createElement('div');
      h.className = 'heart'; h.textContent = '♥';
      h.style.left = Math.random()*100 + 'vw';
      h.style.fontSize = (Math.random()*22 + 16) + 'px';
      h.style.animationDuration = (Math.random()*3 + 3) + 's';
      h.style.animationDelay = (Math.random()*1.2) + 's';
      document.body.appendChild(h);
      setTimeout(function(el){ el.remove(); }.bind(null, h), 7000);
    }
  }
  function open(){ msg.classList.add('show'); hearts(); }
  function close(){ msg.classList.remove('show'); }
  card.addEventListener('click', open);
  card.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
  msg.addEventListener('click', close);
})();

// ---- Twinkling stars ----
(function(){
  var c = $('stars'), x = c.getContext('2d'), stars = [];
  function size(){ c.width = innerWidth; c.height = innerHeight;
    stars = Array.from({length: 90}, function(){ return {x: Math.random()*c.width, y: Math.random()*c.height, r: Math.random()*1.4+.2, p: Math.random()*6.28, v: Math.random()*.02+.005}; }); }
  size(); addEventListener('resize', size);
  (function draw(){
    x.clearRect(0,0,c.width,c.height);
    stars.forEach(function(s){ s.p += s.v; x.globalAlpha = .25 + .75*Math.abs(Math.sin(s.p));
      x.fillStyle = '#fff2f8'; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill(); });
    requestAnimationFrame(draw);
  })();
})();

// ---- Falling petals ----
(function(){
  var c = $('petals'), x = c.getContext('2d'), petals = [];
  var colors = ['#ff8fb1','#ffb3c8','#ffc2d6','#f06292','#ffd6e3'];
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function make(initial){
    return { x: Math.random()*c.width, y: initial ? Math.random()*c.height : -30,
      s: Math.random()*10+9, vy: Math.random()*.9+.5, sw: Math.random()*1.2+.4, ph: Math.random()*6.28,
      rot: Math.random()*6.28, vr: (Math.random()-.5)*.03, col: colors[Math.floor(Math.random()*colors.length)],
      a: Math.random()*.4+.55 };
  }
  function size(){ c.width = innerWidth; c.height = innerHeight;
    petals = Array.from({length: reduce ? 12 : (innerWidth < 600 ? 28 : 50)}, function(){ return make(true); }); }
  size(); addEventListener('resize', size);
  function shape(s){
    x.beginPath(); x.moveTo(0,-s);
    x.bezierCurveTo(s*.9,-s*.7, s*.8,s*.5, 0,s);
    x.bezierCurveTo(-s*.8,s*.5, -s*.9,-s*.7, 0,-s);
    x.fill();
  }
  (function draw(t){
    x.clearRect(0,0,c.width,c.height);
    petals.forEach(function(p,i){
      p.y += p.vy; p.ph += .015; p.x += Math.sin(p.ph)*p.sw; p.rot += p.vr;
      if (p.y > c.height + 30) petals[i] = make(false);
      x.save(); x.translate(p.x,p.y); x.rotate(p.rot); x.scale(.55, Math.abs(Math.cos(p.ph))*.5+.5);
      x.globalAlpha = p.a; x.fillStyle = p.col; x.shadowColor = 'rgba(255,143,177,.5)'; x.shadowBlur = 8;
      shape(p.s); x.restore();
    });
    requestAnimationFrame(draw);
  })();
})();
</script>
</body>
</html>
